# render.yaml
services:
  - type: web
    name: pcb-defect-intelligence
    runtime: python
    buildCommand: >
      pip install torch torchvision
      --index-url https://download.pytorch.org/whl/cpu &&
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0